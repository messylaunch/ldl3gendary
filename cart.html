<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cart — L3GENDARY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23EAB308'/%3E%3Cstop offset='50%25' stop-color='%23F97316'/%3E%3Cstop offset='100%25' stop-color='%23A855F7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%2306060D'/%3E%3Cpath d='M18 48 L32 16 L46 48Z' fill='none' stroke='url(%23g)' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<header class="site-head scrolled">
  <a href="index.html" class="head-brand"><span>L3GENDARY</span></a>
  <nav class="head-nav"><a href="index.html" class="nav-link">Home</a><a href="shop.html" class="nav-link">Shop</a><a href="cart.html" class="nav-link active">Cart</a></nav>
  <div class="head-actions">
    <span style="font-weight:600;font-size:0.84rem;color:var(--text-secondary)"><span id="cart-count-top">0</span> items</span>
  </div>
</header>

<main class="cart-page">
  <div class="wrap">
    <h1 id="cart-title">Your Cart</h1>
    <div id="cart-content"></div>
  </div>
</main>

<footer class="site-foot"><div class="wrap">
  <div class="foot-grid">
    <div><div class="foot-brand"><span>L3GENDARY</span></div><p style="font-size:13px;color:var(--text-muted);margin-top:8px">Music. Apparel. Books. Community.</p></div>
    <div class="foot-col"><h4>SHOP</h4><a href="shop.html">All Products</a><a href="shop.html?category=music">Music</a><a href="shop.html?category=apparel">Apparel</a></div>
    <div class="foot-col"><h4>HELP</h4><a href="mailto:Corporate@ldl3gendary.com">Contact</a><a href="tel:+18008132959">1-800-813-2959</a></div>
  </div>
</div></footer>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script>
document.getElementById('cart-count-top').textContent=cart.count;

function renderCart(){
  const el=document.getElementById('cart-content');
  const title=document.getElementById('cart-title');
  document.getElementById('cart-count-top').textContent=cart.count;

  if(cart.isEmpty){
    title.textContent='Your Cart is Empty';
    el.innerHTML=`<div class="cart-empty-state">
      <div class="cart-empty-icon"><svg class="icon icon-xl" viewBox="0 0 48 48" fill="none" stroke="var(--text-dim)" stroke-width="1.5" opacity="0.3" style="width:64px;height:64px;margin:0 auto"><circle cx="9" cy="41" r="2"/><circle cx="40" cy="41" r="2"/><path d="M2 6h6l5 28h22l6-16H10"/></svg></div>
      <h3>Nothing here yet</h3>
      <p>Start building your legendary collection.</p>
      <a href="shop.html" class="btn btn-accent btn-lg tappable">Browse Shop</a>
    </div>`;
    return;
  }

  title.textContent=`Your Cart (${cart.count})`;
  el.innerHTML=`
    <div class="cart-layout">
      <div class="cart-items-list">
        ${cart.items.map(i=>`
          <div class="cart-item-row">
            <div class="cart-item-img" style="background:${i.color||'var(--bg)'}">
              ${i.image?`<img src="${i.image}" alt="${i.name}" onerror="this.style.display='none';this.parentElement.innerHTML='<svg class=icon viewBox=\\'0 0 24 24\\' fill=none stroke=currentColor stroke-width=2><circle cx=5 cy=17 r=3/><circle cx=17 cy=9 r=3/><line x1=8 y1=17 x2=18 y2=9/></svg>'">`:'<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"><circle cx="5" cy="17" r="3"/><circle cx="17" cy="9" r="3"/><line x1="8" y1="17" x2="18" y2="9"/></svg>'}
            </div>
            <div class="cart-item-detail">
              <div class="ci-name">${i.name}</div>
              <div class="ci-meta">${i.artist}${i.variant?` · ${i.variant}`:''} &nbsp;·&nbsp; $${i.price.toFixed(2)} each</div>
              <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
                <div class="cart-item-controls">
                  <button class="qty-btn tappable" onclick="cart.updateQty(${i.id},${i.qty-1},${i.variant?`'${i.variant}'`:'null'});renderCart()" aria-label="Decrease">−</button>
                  <input class="qty-input" value="${i.qty}" readonly aria-label="Quantity">
                  <button class="qty-btn tappable" onclick="cart.updateQty(${i.id},${i.qty+1},${i.variant?`'${i.variant}'`:'null'});renderCart()" aria-label="Increase">+</button>
                </div>
                <button class="ci-remove tappable" onclick="cart.remove(${i.id},${i.variant?`'${i.variant}'`:'null'});renderCart()" aria-label="Remove item" title="Remove">×</button>
              </div>
            </div>
            <div class="ci-price">$${(i.price*i.qty).toFixed(2)}</div>
          </div>
        `).join('')}
      </div>
      <div class="cart-summary-card">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span>$${cart.subtotal.toFixed(2)}</span></div>
        <div class="summary-row"><span>Tax (est.)</span><span>$${cart.tax.toFixed(2)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>${cart.shipping===0?'<span style="color:var(--success)">Free</span>':`$${cart.shipping.toFixed(2)}`}</span></div>
        <div class="summary-row divider"><span>Total</span><span>$${cart.total.toFixed(2)}</span></div>
        ${cart.subtotal<75?`<p class="ship-hint">Add <strong>$${(75-cart.subtotal).toFixed(2)}</strong> more for free shipping</p>`:''}
        <a href="checkout.html" class="btn btn-accent btn-block tappable" style="margin-top:16px">Proceed to Checkout →</a>
        <button class="btn btn-ghost btn-block tappable" style="margin-top:8px" onclick="cart.clear();renderCart();showToast('Cart cleared')">Clear Cart</button>
      </div>
    </div>
  `;
}

renderCart();
cart.onChange(()=>renderCart());

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
</script>
</body>
</html>
